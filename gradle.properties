# HardPlay build configuration

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# TdApi.java is a single ~200k-line generated file; R8 handles it fine but the
# lint/analysis passes are pointless on generated code.
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
# KSP1 is the battle-tested path for Room 2.6.x + Hilt 2.52 on Kotlin 2.0.
ksp.useKSP2=false
